name: Release

permissions:
  contents: write

on:
  push:
    branches: [main]

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

      - name: Generate version
        id: version
        run: |
          VERSION="1.0.$(git rev-list --count HEAD)"
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Build Release
        run: |
          xcodebuild build \
            -project KeystrokeViewer.xcodeproj \
            -scheme KeystrokeViewer \
            -configuration Release \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Package App
        run: |
          APP_PATH=$(find build/Build/Products/Release -name "*.app" -maxdepth 1)
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" KeystrokeViewer.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: KeystrokeViewer ${{ steps.version.outputs.version }} (${{ steps.version.outputs.short_sha }})
          files: KeystrokeViewer.zip
          generate_release_notes: true
