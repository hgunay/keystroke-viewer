name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

      - name: Build Release
        run: |
          xcodebuild build \
            -project KeystrokeViewer.xcodeproj \
            -scheme KeystrokeViewer \
            -configuration Release \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Package App
        run: |
          APP_PATH=$(find build/Build/Products/Release -name "*.app" -maxdepth 1)
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" KeystrokeViewer.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: KeystrokeViewer.zip
          generate_release_notes: true
